services:
  db-01:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      FLAG: ${FLAG_01}
    volumes:
      - ./apps/01-auth-bypass/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [net-01]

  app-01:
    build: ./apps/01-auth-bypass
    environment:
      DB_HOST: db-01
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: ctf01
    ports:
      - "3001:3000"
    depends_on:
      db-01:
        condition: service_healthy
    networks: [net-01]

