<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>05 - Time Blind</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 500px; margin: 60px auto; color: #222; }
  input { padding: 8px; width: 280px; }
  button { padding: 8px 16px; }
  #result { margin-top: 20px; }
</style>
</head>
<body>
  <h1>メルマガ登録</h1>
  <p>メールアドレスを登録します。</p>
  <input id="email" type="text" placeholder="email" />
  <button id="go">登録</button>
  <div id="result"></div>

  <script>
    async function subscribe() {
      const email = document.getElementById('email').value;
      const start = performance.now();
      const resp = await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'email=' + encodeURIComponent(email),
      });
      const elapsed = performance.now() - start;
      const data = await resp.json();
      document.getElementById('result').textContent =
        data.status + ' (' + elapsed.toFixed(0) + 'ms)';
    }
    document.getElementById('go').addEventListener('click', subscribe);
    document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') subscribe(); });
  </script>
</body>
</html>
