<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>05 - Field Search</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; color: #222; }
  input { padding: 8px; width: 300px; }
  button { padding: 8px 16px; }
  table { border-collapse: collapse; width: 100%; margin-top: 20px; }
  th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
  pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
</style>
</head>
<body>
  <h1>商品検索</h1>
  <select id="field">
    <option value="name">商品名</option>
    <option value="description">説明</option>
    <option value="price">価格</option>
  </select>
  <input id="q" type="text" placeholder="検索語 / 価格" />
  <button id="go">検索</button>
  <div id="output"></div>

  <script>
    async function runSearch() {
      const field = document.getElementById('field').value;
      const q = document.getElementById('q').value;
      const output = document.getElementById('output');
      const resp = await fetch('/search?field=' + encodeURIComponent(field) + '&q=' + encodeURIComponent(q));
      const data = await resp.json();

      if (data.error) {
        output.innerHTML = '<pre>' + data.error + '</pre>';
        return;
      }

      if (!data.results || data.results.length === 0) {
        output.innerHTML = '<p>該当なし。</p>';
        return;
      }

      const rows = data.results.map(r =>
        '<tr><td>' + r.id + '</td><td>' + r.name + '</td><td>' + r.description + '</td></tr>'
      ).join('');
      output.innerHTML = '<table><tr><th>ID</th><th>商品名</th><th>説明</th></tr>' + rows + '</table>';
    }

    document.getElementById('go').addEventListener('click', runSearch);
    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
  </script>
</body>
</html>
