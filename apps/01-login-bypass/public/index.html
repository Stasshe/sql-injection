<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>01 - Login Bypass</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 80px auto; color: #222; }
  h1 { font-size: 1.2rem; }
  input { display: block; width: 100%; box-sizing: border-box; padding: 8px; margin: 8px 0; }
  button { padding: 8px 16px; }
</style>
</head>
<body>
  <h1>Internal Admin Tool</h1>
  <form method="POST" action="/login">
    <input type="text" name="username" placeholder="username" autocomplete="off" />
    <input type="text" name="password" placeholder="password" autocomplete="off" />
    <button type="submit">Login</button>
  </form>
</body>
</html>
